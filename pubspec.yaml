name: inventario_app
description: App de inventario offline-first
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Base de datos local
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.2

  # Almacenamiento simple
  shared_preferences: ^2.3.2

  # UUID
  uuid: ^4.5.1

  # Gráficos interactivos (compatible con Flutter 3.35)
  fl_chart: ^0.55.2

  # UI opcional
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true